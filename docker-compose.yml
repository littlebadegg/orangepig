services:
  # ===== Node.js 后端 =====
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: orangepig-server
    restart: unless-stopped
    # 不直接暴露端口，通过 Nginx 反向代理访问
    expose:
      - "3000"
    environment:
      - PORT=3000
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-orangepig}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - WX_APPID=${WX_APPID}
      - WX_SECRET=${WX_SECRET}
      - UPLOAD_DIR=uploads
      - STATIC_BASE_URL=${STATIC_BASE_URL:-http://localhost}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-15728640}
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - orangepig-net

  # ===== Nginx 反向代理 =====
  nginx:
    image: nginx:alpine
    container_name: orangepig-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./server/uploads:/app/uploads:ro
    depends_on:
      - server
    networks:
      - orangepig-net

  # 如果需要本地 MySQL，取消注释以下配置
  # mysql:
  #   image: mysql:8.0
  #   container_name: orangepig-mysql
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
  #     MYSQL_DATABASE: ${DB_NAME:-orangepig}
  #   ports:
  #     - "3307:3306"
  #   volumes:
  #     - orangepig-mysql-data:/var/lib/mysql
  #   networks:
  #     - orangepig-net

networks:
  orangepig-net:
    driver: bridge
