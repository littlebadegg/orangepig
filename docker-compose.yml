services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: orangepig-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-orangepig}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - WX_APPID=${WX_APPID}
      - WX_SECRET=${WX_SECRET}
      - UPLOAD_DIR=uploads
      - STATIC_BASE_URL=${STATIC_BASE_URL:-http://localhost:3000}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-15728640}
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - orangepig-net

  # 如果需要本地 MySQL，取消注释以下配置
  # mysql:
  #   image: mysql:8.0
  #   container_name: orangepig-mysql
