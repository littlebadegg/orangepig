  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
  #     MYSQL_DATABASE: ${DB_NAME:-orangepig}
  #   ports:
  #     - "3307:3306"
  #   volumes:
  #     - orangepig-mysql-data:/var/lib/mysql
  #   networks:
  #     - orangepig-net

networks:
  orangepig-net:
    driver: bridge
